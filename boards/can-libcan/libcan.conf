# io-sock config file for the can-libcan driver.
# Load with: io-sock ... -o prefix=<prefix>,config=<path-to-this-file>
#
# By default all found libcan device are added as SocketCAN devices
# in which case no configuration is required

# This configuration disables auto discover and adds 2 libcan devices (1 CAN Classic 1 CANFD)
hint.libcan.0.auto="off"

# native /dev/can1 -> SocketCAN can0
hint.libcan.0.dev="/dev/can1"

# native /dev/can2 -> SocketCAN can5 (avoids colliding with can-dummy/can-vcan/
# can-mcp25xxfd, which all allocate sequentially starting from can0)
hint.libcan.5.dev="/dev/can2"

# Mark can5 as CAN FD capable. Needed to transmit FD frames; the native API
# has no way to report FD support, so it must be configured.
hint.libcan.5.fd="on"
