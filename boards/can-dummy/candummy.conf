# io-sock config file for the can-dummy driver.
# Load with: io-sock ... -o prefix=/can,config=<path-to-this-file>
#
# The driver walks units 0..N and creates canN only for units whose "create" key
# is "true". Per-unit keys (read via the hint API, hence the "hint." prefix):
#
#   hint.dummy.<unit>.create="true"    create this unit as canN
#   hint.dummy.<unit>.fd="true"        emit CAN FD frames instead of Classic
#   hint.dummy.<unit>.rate_ms="500"    emission period in ms (default 1000)
#
# No extra whitespace is permitted on tunable lines.

# can0: Classic frames, once per second (default rate).
hint.dummy.0.create="true"

# can1: CAN FD frames, twice per second.
hint.dummy.1.create="true"
hint.dummy.1.fd="true"
hint.dummy.1.rate_ms="500"
