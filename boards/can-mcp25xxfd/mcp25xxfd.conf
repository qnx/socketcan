# io-sock config file for the can-mcp25xxfd driver.
# Load with: io-sock ... -o prefix=<prefix>,config=<path-to-this-file>
#
# The driver walks units 0..N and creates canN only for units that have a
# "dev" hint set. Per-unit keys (read via the hint API, hence the "hint."
# prefix): dev, gpio, and platform are required; bps, dbps, osc, fd,
# tx_fifo_size, and rx_fifo_size are optional. See devs-can-mcp25xxfd.use
# for the full key reference.
#

# can0: Waveshare 2-CH CAN FD HAT's CAN0 chip
hint.mcp25xxfd.0.dev="/dev/io-spi/spi0/dev0"
hint.mcp25xxfd.0.gpio="25"
hint.mcp25xxfd.0.bps="500000"

# can1: the HAT's CAN1 chip. Classic-only, defaults, temporarily matching
hint.mcp25xxfd.1.dev="/dev/io-spi/spi1/dev0"
hint.mcp25xxfd.1.gpio="24"
